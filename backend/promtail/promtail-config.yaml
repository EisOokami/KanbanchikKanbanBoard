server:
    http_listen_port: 9080
    grpc_listen_port: 0
    log_level: info

positions:
    filename: /tmp/positions.yaml

clients:
    - url: http://loki:3100/loki/api/v1/push

scrape_configs:
    - job_name: backend-app
      static_configs:
          - targets:
                - localhost
            labels:
                job: backend
                service: express-backend
                env: production
                __path__: /var/logs/app/*.log

      pipeline_stages:
          - json:
                expressions:
                    level: level
                    status: res.statusCode
                    method: req.method
                    msg: msg
                    time: time
                    audit: audit

          - labels:
                level:
                status:
                method:
                audit:

          - timestamp:
                source: time
                format: UnixMs
