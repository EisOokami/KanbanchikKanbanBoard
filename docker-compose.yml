services:
    mariadb:
        image: mariadb:latest
        container_name: mariadb-container
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        ports:
            - "127.0.0.1:3306:3306"
        volumes:
            - mariadb_storage:/var/lib/mysql
            - ./backend/database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    backend:
        build:
            context: ./backend
        ports:
            - "3001:3001"
        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
            EMAIL_SERVICE: ${EMAIL_SERVICE}
            EMAIL_USER: ${EMAIL_USER}
            EMAIL_PASSWORD: ${EMAIL_PASSWORD}
            FRONTEND_URL: ${FRONTEND_URL}
            BACKEND_URL: ${BACKEND_URL}
            CORS_URLS: ${CORS_URLS}
            HOSTS: ${HOSTS}
            TRUST_PROXY: ${TRUST_PROXY}
            CSRF_SECRET: ${CSRF_SECRET}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
            MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
            LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET}
            DELETION_CODE_SECRET: ${DELETION_CODE_SECRET}
            TRANSFER_CODE_SECRET: ${TRANSFER_CODE_SECRET}
            TERMS_VERSION: ${TERMS_VERSION}
            PRIVACY_VERSION: ${PRIVACY_VERSION}
            LOG_LEVEL: ${LOG_LEVEL}
            LOG_FILE: ${LOG_FILE}
            GEMINI_MODEL: ${GEMINI_MODEL}
            FILE_URL_SECRET: ${FILE_URL_SECRET:-}
            FILE_URL_TTL_HOURS: ${FILE_URL_TTL_HOURS:-}
            LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
            MAX_INVITES_PER_DAY: ${MAX_INVITES_PER_DAY:-}
            RETENTION_CLEANUP: ${RETENTION_CLEANUP:-}
        depends_on:
            - mariadb
        restart: unless-stopped
        volumes:
            - ./backend/logs:/var/logs/app
            - ./backend/uploads:/app/uploads
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
        mem_limit: 300m
        cpus: 0.6

    loki:
        image: grafana/loki:2.9.6
        container_name: loki
        restart: unless-stopped
        ports:
            - "127.0.0.1:3100:3100"
        volumes:
            - ./backend/loki-config.yaml:/etc/loki/local-config.yaml:ro
            - loki-data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        mem_limit: 700m
        cpus: 1.0
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:3100/ready || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    promtail:
        image: grafana/promtail:2.9.6
        container_name: promtail
        restart: unless-stopped
        volumes:
            - ./backend/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
            - ./backend/logs:/var/logs/app:ro
            - promtail-positions:/tmp
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki
        mem_limit: 150m
        cpus: 0.3

    grafana:
        image: grafana/grafana:10.4.2
        container_name: grafana
        restart: unless-stopped
        ports:
            - "127.0.0.1:3200:3000"
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
            GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_ALLOW_SIGN_UP}
            GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS}
        volumes:
            - grafana-data:/var/lib/grafana
            - ./backend/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./backend/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./backend/grafana-dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - loki
        mem_limit: 300m
        cpus: 0.4

    frontend:
        build:
            context: ./frontend
            args:
                - NEXT_PUBLIC_API_URL
                - NEXT_PUBLIC_INTERNAL_API_URL
                - NEXT_PUBLIC_SITE_URL
                - API_PROTOCOL
                - API_HOSTNAME
                - API_PORT
                - ADDITIONAL_PROTOCOL
                - ADDITIONAL_HOSTNAME
                - ADDITIONAL_PORT
                - TERMS_VERSION
                - PRIVACY_VERSION
                - LEGAL_LAST_TERMS_UPDATED
                - LEGAL_EFFECTIVE_TERMS_DATE
                - LEGAL_LAST_PRIVACY_UPDATED
                - LEGAL_EFFECTIVE_PRIVACY_DATE
                - LEGAL_OPERATOR
                - LEGAL_CONTACT_EMAIL
                - LEGAL_SERVER_PROVIDER
                - LEGAL_BACKUP_RETENTION
                - LEGAL_REPOSITORY_URL
                - LEGAL_LICENSE_URL
        ports:
            - "3000:3000"
        environment:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
            API_URL: ${API_URL}
            CLIENT_IP_HEADER: ${CLIENT_IP_HEADER}
            HOST: ${HOST}
            NEXT_PUBLIC_INTERNAL_API_URL: ${NEXT_PUBLIC_INTERNAL_API_URL}
            INTERNAL_IMG_SRC_URL: ${INTERNAL_IMG_SRC_URL}
            INTERNAL_CONNECT_SRC_URL: ${INTERNAL_CONNECT_SRC_URL}
            API_PROTOCOL: ${API_PROTOCOL}
            API_HOSTNAME: ${API_HOSTNAME}
            API_PORT: ${API_PORT}
            ADDITIONAL_PROTOCOL: ${ADDITIONAL_PROTOCOL}
            ADDITIONAL_HOSTNAME: ${ADDITIONAL_HOSTNAME}
            ADDITIONAL_PORT: ${ADDITIONAL_PORT}
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    loki-data:
    grafana-data:
    promtail-positions:
    mariadb_storage:
