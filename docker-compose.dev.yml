services:
    mariadb:
        image: mariadb:latest
        container_name: mariadb-container
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3307:3306"
        volumes:
            - mariadb_storage:/var/lib/mysql
            - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

    backend:
        build:
            context: ./backend
            dockerfile: dockerfile.dev
        ports:
            - "3001:3001"
        environment:
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
            EMAIL_SERVICE: ${EMAIL_SERVICE}
            EMAIL_USER: ${EMAIL_USER}
            EMAIL_PASSWORD: ${EMAIL_PASSWORD}
            FRONTEND_URL: ${FRONTEND_URL}
            BACKEND_URL: ${BACKEND_URL}
            CORS_URLS: ${CORS_URLS}
            HOSTS: ${HOSTS}
            TRUST_PROXY: ${TRUST_PROXY}
            CSRF_SECRET: ${CSRF_SECRET}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
            MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
            LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET}
            DELETION_CODE_SECRET: ${DELETION_CODE_SECRET}
            TRANSFER_CODE_SECRET: ${TRANSFER_CODE_SECRET}
            TERMS_VERSION: ${TERMS_VERSION}
            PRIVACY_VERSION: ${PRIVACY_VERSION}
            LOG_LEVEL: ${LOG_LEVEL}
            LOG_FILE: ${LOG_FILE}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            GEMINI_MODEL: ${GEMINI_MODEL}
        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            - mariadb

    loki:
        image: grafana/loki:2.9.6
        container_name: loki
        restart: unless-stopped
        expose:
            - "3100"
        volumes:
            - ./backend/loki-config.yaml:/etc/loki/local-config.yaml:ro
            - loki-data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:3100/ready || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    promtail:
        image: grafana/promtail:2.9.6
        container_name: promtail
        restart: unless-stopped
        volumes:
            - ./backend/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
            - ./backend/logs:/var/logs/app:ro
            - promtail-positions:/tmp
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki

    grafana:
        image: grafana/grafana:10.4.2
        container_name: grafana
        restart: unless-stopped
        ports:
            - "3200:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_ALLOW_SIGN_UP}
            - GF_INSTALL_PLUGINS=${GRAFANA_INSTALL_PLUGINS}
        volumes:
            - grafana-data:/var/lib/grafana
            - ./backend/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./backend/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./backend/grafana-dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - loki

    frontend:
        build:
            context: ./frontend
            dockerfile: dockerfile.dev
        ports:
            - "3000:3000"
        environment:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
            API_URL: ${API_URL}
            CLIENT_IP_HEADER: ${CLIENT_IP_HEADER}
            HOST: ${HOST}
            NEXT_PUBLIC_INTERNAL_API_URL: ${NEXT_PUBLIC_INTERNAL_API_URL}
            INTERNAL_IMG_SRC_URL: ${INTERNAL_IMG_SRC_URL}
            INTERNAL_CONNECT_SRC_URL: ${INTERNAL_CONNECT_SRC_URL}
            API_PROTOCOL: ${API_PROTOCOL}
            API_HOSTNAME: ${API_HOSTNAME}
            API_PORT: ${API_PORT}
            ADDITIONAL_PROTOCOL: ${ADDITIONAL_PROTOCOL}
            ADDITIONAL_HOSTNAME: ${ADDITIONAL_HOSTNAME}
            ADDITIONAL_PORT: ${ADDITIONAL_PORT}
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
            - /app/.next
        depends_on:
            - backend

volumes:
    loki-data:
    grafana-data:
    promtail-positions:
    mariadb_storage:
    backend_node_modules:
    frontend_node_modules:
